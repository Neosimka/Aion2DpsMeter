name: Aion2DpsMeter - Compiler l'installateur Windows

# Lancement : onglet "Actions" du dépôt → "Aion2DpsMeter - Compiler l'installateur
# Windows" → "Run workflow". Au bout de ~15 à 25 min, l'installateur .msi est
# dans l'onglet "Releases", et latest.json (lu par la mise à jour automatique
# du meter) est mis à jour sur la branche main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Brancher la mise à jour automatique sur ce dépôt
        run: |
          sed -i "s#__AION2DPS_REPO__#${GITHUB_REPOSITORY}#g" public/src/js/checkRelease.js public/src/js/core.js
          grep -n "${GITHUB_REPOSITORY}" public/src/js/checkRelease.js public/src/js/core.js

      - name: Vérifier la clé de légion
        env:
          CHEVRERIE_KEY: ${{ secrets.CHEVRERIE_KEY }}
        run: |
          if [ -z "$CHEVRERIE_KEY" ]; then
            echo "::error::Le secret CHEVRERIE_KEY est absent (Settings → Secrets and variables → Actions). Sans lui, le meter n'enverrait aucun combat au site."
            exit 1
          fi
          echo "Clé de légion présente (${#CHEVRERIE_KEY} caractères)."
          code=$(curl -s --max-time 20 --retry 3 --retry-all-errors -o check.json -w "%{http_code}" \
            -H "x-chevrerie-key: ${CHEVRERIE_KEY}" https://aion2-la-chevrerie.netlify.app/api/meter/check || true)
          cat check.json 2>/dev/null || true; echo
          if [ "$code" = "200" ]; then
            echo "Le site accepte la clé de légion."
          elif [ "$code" = "500" ]; then
            echo "::error::Netlify ne voit pas CHEVRERIE_KEY (HTTP 500). Dans le dossier du site : netlify env:set CHEVRERIE_KEY ... puis netlify deploy --prod (le redéploiement est indispensable)."
            exit 1
          elif [ "$code" = "401" ]; then
            echo "::error::Le site refuse la clé (HTTP $code). Remets exactement la même clé sur GitHub (secret CHEVRERIE_KEY) et sur Netlify (netlify env:set CHEVRERIE_KEY ... puis netlify deploy --prod)."
            exit 1
          else
            echo "::warning::Contrôle de la clé impossible (HTTP $code) : site pas encore à jour ? La compilation continue."
          fi

      - name: Dépendances
        run: npm ci

      - name: Compiler (Tauri → MSI)
        env:
          # Clé de la légion pour envoyer les combats au site La Chevrerie.
          CHEVRERIE_KEY: ${{ secrets.CHEVRERIE_KEY }}
        run: npm run tauri build

      - name: Publier la release et latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v${VERSION}"
          MSI_SRC=$(ls src-tauri/target/release/bundle/msi/*.msi | head -n1)
          MSI="Aion2DpsMeter-${VERSION}-x64.msi"
          cp "$MSI_SRC" "$MSI"
          SHA=$(sha256sum "$MSI" | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${MSI}"
          echo "Version ${VERSION} — ${MSI} — sha256 ${SHA}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$MSI" --clobber
          else
            gh release create "$TAG" "$MSI" --title "Aion2DpsMeter ${VERSION}" \
              --notes "Installateur Windows d'Aion2DpsMeter ${VERSION}. Prérequis : Npcap (npcap.com), mode compatible WinPcap coché."
          fi

          printf '{\n  "version": "%s",\n  "msiUrl": "%s",\n  "msiSha256": "%s"\n}\n' "$VERSION" "$URL" "$SHA" > latest.json
          cat latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -- public/src/js/checkRelease.js public/src/js/core.js
          git add latest.json
          git commit -m "latest.json : ${VERSION}" || echo "latest.json inchangé"
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: Aion2DpsMeter-msi
          path: Aion2DpsMeter-*.msi
